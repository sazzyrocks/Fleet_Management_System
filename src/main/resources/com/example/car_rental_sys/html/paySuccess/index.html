<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay success</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 22px;
            display: none;
            z-index: 10;
            background: rgba(15, 23, 42, 0.92);
            padding: 40px 60px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.85);
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -45%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        img {
            width: 90px;
            height: 90px;
            margin-bottom: 14px;
        }

        button {
            color: white;
            background-color: #3c7eff;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 19px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(60, 126, 255, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #2668f0;
            transform: scale(1.04);
        }

        p {
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <video id="successVideo" src="./video2.mp4" autoplay muted playsinline></video>

    <div id="container">
        <img src="success.png" alt="success">
        <p style="font-size: 26px; font-weight: bold; color: #4ade80;">Payment Completed</p>
        <p style="color: #cbd5e1;">Your car is confirmed and on the way!</p>
        <button onclick="buttonClickEvent()">View My Orders &rarr;</button>
    </div>

    <script>
        const video = document.getElementById('successVideo');
        const container = document.getElementById('container');
        let shown = false;

        function showPaymentDone() {
            if (shown) return;
            shown = true;
            if (container) {
                container.style.display = 'block';
            }
        }

        function buttonClickEvent() {
            alert("CLOSE_PAY_SUCCESS");
        }

        if (video) {
            video.muted = true;

            // Video khatam hone ke baad hi payment done dikhega
            video.addEventListener('ended', showPaymentDone);

            video.play().catch(function(e) {
                console.log('Video play caught:', e);
            });
        }

        // Failsafe: Video 16 seconds ki hai, agar ended event miss ho toh 16.5s pe show ho
        setTimeout(showPaymentDone, 16500);
    </script>
</body>

</html>
