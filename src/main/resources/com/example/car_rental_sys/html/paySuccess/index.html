<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay success</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 22px;
            display: none;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            padding: 35px 55px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        img {
            width: 80px;
            height: 80px;
            margin-bottom: 12px;
        }

        button {
            color: white;
            background-color: #3c7eff;
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            margin-top: 18px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(60, 126, 255, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #2668f0;
            transform: scale(1.04);
        }

        p {
            margin-top: 6px;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <video id="successVideo" src="./video2.mp4" autoplay muted playsinline loop></video>

    <div id="container">
        <img src="success.png" alt="success">
        <p style="font-size: 26px; font-weight: bold; color: #4ade80;">Transaction Completed</p>
        <p style="color: #cbd5e1;">Your car is confirmed and ready for pickup!</p>
        <button onclick="buttonClickEvent()">View My Orders &rarr;</button>
    </div>

    <script>
        const video = document.getElementById('successVideo');
        const container = document.getElementById('container');

        function buttonClickEvent() {
            alert("CLOSE_PAY_SUCCESS");
        }

        // Play video immediately
        if (video) {
            video.muted = true;
            video.play().catch(function(e) {
                console.log('Video play caught:', e);
            });
        }

        // Show completed confirmation card after 6 seconds over the video
        setTimeout(function() {
            if (container) {
                container.style.display = 'block';
            }
        }, 6000);
    </script>
</body>

</html>
